name: WiredPad
options:
  bundleIdPrefix: com.example.wiredpad
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: NO
    WIREPAD_BUNDLE_PREFIX: com.example.wiredpad
targets:
  WiredPadMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Resources
      - path: Mac
        excludes:
          - DisplayModeHelper.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIREPAD_BUNDLE_PREFIX).WiredPadMac"
        INFOPLIST_FILE: Mac/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Mac/WiredPadMac-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Mac/WiredPadMac-HID.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WiredPadPad:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Resources
      - path: Pad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIREPAD_BUNDLE_PREFIX).WiredPadPad"
        INFOPLIST_FILE: Pad/Info.plist
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Pad/WiredPadPad.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
